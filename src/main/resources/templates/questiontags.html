<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Связи вопрос-тег | Ответы по 500 рублей</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div id="space-background"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<div th:replace="~{fragments :: site-sidebar}"></div>

<div th:replace="~{fragments :: site-header}"></div>

<main class="crud-container">
    <h1 class="page-title"><i class="fas fa-link"></i> Связи вопрос-тег</h1>

    <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>
    <div th:if="${infoMessage}" class="info-message" th:text="${infoMessage}"></div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Вопрос</th>
            <th>Тег</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="qt : ${qt}">
            <td th:text="${qt.question.title}"></td>
            <td th:text="${qt.tag.name}"></td>
        </tr>
        </tbody>
    </table>

    <h2 class="section-title">Добавить связь</h2>
    <form th:action="@{/question-tags/add}" method="post" class="crud-form">
        <div class="form-group">
            <select name="questionTitle" required>
                <option value="">Выберите вопрос</option>
                <option th:each="q : ${allQuestions}"
                        th:value="${q.title}"
                        th:text="${q.title}"></option>
            </select>
        </div>
        <div class="form-group">
            <select name="tagName" required>
                <option value="">Выберите тег</option>
                <option th:each="t : ${allTags}"
                        th:value="${t.name}"
                        th:text="${t.name}"></option>
            </select>
        </div>
        <button type="submit"><i class="fas fa-plus"></i> Добавить</button>
    </form>

    <div class="pagination">
        <a th:if="${currentPage > 1}" th:href="@{/question-tags(page=${currentPage - 1})}" class="pagination-link"><i class="fas fa-chevron-left"></i> Назад</a>
        <span class="current-page" th:text="${currentPage}"></span>
        <a th:href="@{/question-tags(page=${currentPage + 1})}" class="pagination-link">Вперед <i class="fas fa-chevron-right"></i></a>
    </div>
</main>

<footer><div class="footer-links"><a href="/feedback.jpg">Обратная связь</a></div></footer>

<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    }
</script>
</body>
</html>
