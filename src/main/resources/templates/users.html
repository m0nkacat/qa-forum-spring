<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи | Ответы по 500 рублей</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div id="space-background"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<div th:replace="~{fragments :: site-sidebar}"></div>

<div th:replace="~{fragments :: site-header}"></div>

<main class="crud-container">
    <h1 class="page-title"><i class="fas fa-users"></i> Пользователи</h1>

    <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>
    <div th:if="${infoMessage}" class="info-message" th:text="${infoMessage}"></div>

    <div class="search-row">
        <form th:action="@{/users/search}" method="get" class="inline-form">
            <input type="text" name="keyword" placeholder="Поиск">
            <button type="submit"><i class="fas fa-search"></i> Найти</button>
        </form>
        <form th:action="@{/users/searchById}" method="get" class="inline-form">
            <input type="number" name="id" placeholder="Поиск по ID">
            <button type="submit"><i class="fas fa-search"></i> Найти</button>
        </form>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Password</th>
            <th>Role</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.userId}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.password}"></td>
            <td th:text="${u.roleId}"></td>
            <td>
                <form th:action="@{/users/delete}" method="post" class="delete-form">
                    <input type="hidden" name="id" th:value="${u.userId}">
                    <button type="submit" class="icon-btn" title="Удалить"><i class="fas fa-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="section-title">Добавить пользователя</h2>
    <form th:action="@{/users/add}" th:object="${user}" method="post" class="crud-form">
        <div class="form-group">
            <input type="text" th:field="*{username}" placeholder="Имя">
            <div th:if="${#fields.hasErrors('username')}" class="field-error" th:errors="*{username}"></div>
        </div>
        <div class="form-group">
            <input type="text" th:field="*{password}" placeholder="Пароль">
            <div th:if="${#fields.hasErrors('password')}" class="field-error" th:errors="*{password}"></div>
        </div>
        <div class="form-group">
            <select name="roleId" required>
                <option value="">Выберите роль</option>
                <option th:each="r : ${allRoles}"
                        th:value="${r.roleId}"
                        th:text="${r.name}"></option>
            </select>
            <div th:if="${errorRole}" class="field-error" th:text="${errorRole}"></div>
        </div>
        <button type="submit"><i class="fas fa-plus"></i> Добавить</button>
    </form>

    <div class="pagination">
        <a th:if="${currentPage > 1}" th:href="@{/users(page=${currentPage - 1})}" class="pagination-link"><i class="fas fa-chevron-left"></i> Назад</a>
        <span class="current-page" th:text="${currentPage}"></span>
        <a th:href="@{/users(page=${currentPage + 1})}" class="pagination-link">Вперед <i class="fas fa-chevron-right"></i></a>
    </div>
</main>

<footer><div class="footer-links"><a href="/feedback.jpg">Обратная связь</a></div></footer>

<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    }
</script>
</body>
</html>
