<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голоса | Ответы по 500 рублей</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div id="space-background"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<div th:replace="~{fragments :: site-sidebar}"></div>

<div th:replace="~{fragments :: site-header}"></div>

<main class="crud-container">
    <h1 class="page-title"><i class="fas fa-thumbs-up"></i> Голоса</h1>

    <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>
    <div th:if="${infoMessage}" class="info-message" th:text="${infoMessage}"></div>

    <div class="search-row">
        <form th:action="@{/votes/searchById}" method="get" class="inline-form">
            <input type="number" name="id" placeholder="Поиск по ID">
            <button type="submit"><i class="fas fa-search"></i> Найти</button>
        </form>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Пользователь</th>
            <th>Вопрос</th>
            <th>Ответ</th>
            <th>Тип</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${votes}">
            <td th:text="${v.voteId}"></td>
            <td th:text="${v.user.username}"></td>
            <td th:text="${v.question.title}"></td>
            <td th:text="${v.answer?.body}"></td>
            <td th:text="${v.voteType}"></td>
            <td>
                <form th:action="@{/votes/delete}" method="post" class="delete-form">
                    <input type="hidden" name="id" th:value="${v.voteId}">
                    <button type="submit" class="icon-btn" title="Удалить"><i class="fas fa-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="section-title">Добавить голос</h2>
    <form th:action="@{/votes/add}" th:object="${vote}" method="post" class="crud-form">
        <div class="form-group">
            <select name="username" required>
                <option value="">Пользователь</option>
                <option th:each="u : ${allUsers}"
                        th:value="${u.username}"
                        th:text="${u.username}"></option>
            </select>
            <div th:if="${errorUser}" class="field-error" th:text="${errorUser}"></div>
        </div>
        <div class="form-group">
            <select name="questionTitle" required>
                <option value="">Вопрос</option>
                <option th:each="q : ${allQuestions}"
                        th:value="${q.title}"
                        th:text="${q.title}"></option>
            </select>
            <div th:if="${errorQuestion}" class="field-error" th:text="${errorQuestion}"></div>
        </div>
        <div class="form-group">
            <select name="answerId">
                <option value="">Без ответа</option>
                <option th:each="a : ${allAnswers}"
                        th:value="${a.answerId}"
                        th:text="${a.body}"></option>
            </select>
        </div>
        <div class="form-group">
            <select th:field="*{voteType}" required>
                <option value="">Тип голоса</option>
                <option value="1">За (+1)</option>
                <option value="-1">Против (-1)</option>
            </select>
            <div th:if="${#fields.hasErrors('voteType')}" class="field-error" th:errors="*{voteType}"></div>
        </div>
        <button type="submit"><i class="fas fa-plus"></i> Добавить</button>
    </form>

    <div class="pagination">
        <a th:if="${currentPage > 1}" th:href="@{/votes(page=${currentPage - 1})}" class="pagination-link"><i class="fas fa-chevron-left"></i> Назад</a>
        <span class="current-page" th:text="${currentPage}"></span>
        <a th:href="@{/votes(page=${currentPage + 1})}" class="pagination-link">Вперед <i class="fas fa-chevron-right"></i></a>
    </div>
</main>

<footer><div class="footer-links"><a href="/feedback.jpg">Обратная связь</a></div></footer>

<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    }
</script>
</body>
</html>
