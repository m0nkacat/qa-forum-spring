<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ответы | Ответы по 500 рублей</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div id="space-background"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<div th:replace="~{fragments :: site-sidebar}"></div>

<div th:replace="~{fragments :: site-header}"></div>

<main class="crud-container">
    <h1 class="page-title"><i class="fas fa-comment-dots"></i> Ответы</h1>

    <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>
    <div th:if="${infoMessage}" class="info-message" th:text="${infoMessage}"></div>

    <div class="search-row">
        <form th:action="@{/answers/search}" method="get" class="inline-form">
            <input type="text" name="keyword" placeholder="Поиск">
            <button type="submit"><i class="fas fa-search"></i> Найти</button>
        </form>
        <form th:action="@{/answers/searchById}" method="get" class="inline-form">
            <input type="number" name="id" placeholder="Поиск по ID">
            <button type="submit"><i class="fas fa-search"></i> Найти</button>
        </form>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Текст</th>
            <th>Принят</th>
            <th>Вопрос</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${answers}">
            <td th:text="${a.answerId}"></td>
            <td th:text="${a.body}"></td>
            <td th:text="${a.isAccepted}"></td>
            <td th:text="${a.question.title}"></td>
            <td>
                <form th:action="@{/answers/delete}" method="post" class="delete-form">
                    <input type="hidden" name="id" th:value="${a.answerId}">
                    <button type="submit" class="icon-btn" title="Удалить"><i class="fas fa-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="section-title">Добавить ответ</h2>
    <form th:action="@{/answers/add}" th:object="${answer}" method="post" class="crud-form">
        <div class="form-group">
            <select name="questionTitle" required>
                <option value="">Выберите вопрос</option>
                <option th:each="q : ${allQuestions}"
                        th:value="${q.title}"
                        th:text="${q.title}"></option>
            </select>
            <div th:if="${#fields.hasErrors('question')}" class="field-error" th:errors="*{question}"></div>
            <div th:if="${errorQuestion}" class="field-error" th:text="${errorQuestion}"></div>
        </div>
        <div class="form-group">
            <input type="text" th:field="*{body}" placeholder="Текст ответа">
            <div th:if="${#fields.hasErrors('body')}" class="field-error" th:errors="*{body}"></div>
        </div>
        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" th:field="*{accepted}">
                Принятый ответ
            </label>
        </div>
        <button type="submit"><i class="fas fa-plus"></i> Добавить</button>
    </form>

    <div class="pagination">
        <a th:if="${currentPage > 1}" th:href="@{/answers(page=${currentPage - 1})}" class="pagination-link"><i class="fas fa-chevron-left"></i> Назад</a>
        <span class="current-page" th:text="${currentPage}"></span>
        <a th:href="@{/answers(page=${currentPage + 1})}" class="pagination-link">Вперед <i class="fas fa-chevron-right"></i></a>
    </div>
</main>

<footer><div class="footer-links"><a href="/feedback.jpg">Обратная связь</a></div></footer>

<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    }
</script>
</body>
</html>
