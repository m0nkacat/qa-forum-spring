<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Роли | Ответы по 500 рублей</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div id="space-background"></div>
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<div th:replace="~{fragments :: site-sidebar}"></div>

<div th:replace="~{fragments :: site-header}"></div>

<main class="crud-container">
    <h1 class="page-title"><i class="fas fa-user-tag"></i> Роли</h1>

    <!-- Сообщения -->
    <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>
    <div th:if="${infoMessage}" class="info-message" th:text="${infoMessage}"></div>

    <!-- Поиск -->
    <div class="search-row">
        <form th:action="@{/roles/search}" method="get" class="inline-form">
            <input type="text" name="keyword" placeholder="Поиск по названию">
            <button type="submit"><i class="fas fa-search"></i> Найти</button>
        </form>
        <form th:action="@{/roles/searchById}" method="get" class="inline-form">
            <input type="number" name="id" placeholder="Поиск по ID">
            <button type="submit"><i class="fas fa-search"></i> Найти</button>
        </form>
    </div>

    <!-- Таблица -->
    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${roles}">
            <td th:text="${r.roleId}"></td>
            <td th:text="${r.name}"></td>
            <td>
                <form th:action="@{/roles/delete}" method="post" class="delete-form">
                    <input type="hidden" name="id" th:value="${r.roleId}">
                    <button type="submit" class="icon-btn" title="Удалить"><i class="fas fa-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Добавление -->
    <h2 class="section-title">Добавить роль</h2>
    <form th:action="@{/roles/add}" th:object="${role}" method="post" class="crud-form">
        <div class="form-group">
            <input type="text" th:field="*{name}" placeholder="Название роли">
            <div th:if="${#fields.hasErrors('name')}" class="field-error" th:errors="*{name}"></div>
        </div>
        <button type="submit"><i class="fas fa-plus"></i> Добавить</button>
    </form>

    <!-- Пагинация -->
    <div class="pagination">
        <a th:if="${currentPage > 1}" th:href="@{/roles(page=${currentPage - 1})}" class="pagination-link"><i class="fas fa-chevron-left"></i> Назад</a>
        <span class="current-page" th:text="${currentPage}"></span>
        <a th:href="@{/roles(page=${currentPage + 1})}" class="pagination-link">Вперед <i class="fas fa-chevron-right"></i></a>
    </div>
</main>

<footer><div class="footer-links"><a href="/feedback.jpg">Обратная связь</a></div></footer>

<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    }
</script>
</body>
</html>
