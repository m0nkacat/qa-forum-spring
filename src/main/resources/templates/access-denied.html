<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Доступ запрещён | Ответы по 500 рублей</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .denied-wrapper { display:flex; justify-content:center; align-items:center; min-height:80vh; padding:2rem; }
        .denied-card { background:rgba(20,10,10,.93); border:2px solid rgba(220,60,60,.5);
            border-radius:16px; padding:3rem 3.5rem; max-width:520px; width:100%; text-align:center; box-shadow:0 0 40px rgba(220,60,60,.2); }
        .denied-icon { font-size:4rem; color:#e05050; margin-bottom:1.2rem; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
        .denied-card h1 { color:#ff8080; font-size:1.8rem; margin-bottom:.8rem; }
        .denied-card p { color:#ccc; line-height:1.6; margin-bottom:1.5rem; }
        .denied-role { display:inline-block; background:rgba(220,60,60,.15); border:1px solid rgba(220,60,60,.4);
            border-radius:6px; padding:.3rem .8rem; color:#ffa0a0; font-size:.9rem; margin-bottom:1.5rem; }
        .btn-back { display:inline-block; padding:.8rem 2rem; background:#4a5ff7; color:#fff; border-radius:8px; text-decoration:none; font-size:1rem; }
        .btn-back:hover { background:#6272fa; }
    </style>
</head>
<body>
<div id="space-background"></div>
<div class="denied-wrapper">
    <div class="denied-card">
        <div class="denied-icon"><i class="fas fa-ban"></i></div>
        <h1>Доступ запрещён</h1>
        <p>У вас недостаточно прав для просмотра этой страницы.<br>
           Эта функция доступна только пользователям с повышенными привилегиями.</p>
        <div th:if="${isAuth}" class="denied-role">
            <i class="fas fa-user-tag"></i> Ваши роли: <strong th:text="${currentRoles}"></strong>
        </div>
        <br>
        <a th:href="@{/home}" class="btn-back"><i class="fas fa-home"></i> Вернуться на главную</a>
    </div>
</div>
</body>
</html>
